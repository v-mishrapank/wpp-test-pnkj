name: Deploy ingest dispatcher function

on:
  push:
    branches:
      - dev
    paths:
      - "src/analytics/ingest/dispatcher/src/IngestDispatcher.Functions/**/*.cs"
      - "src/analytics/ingest/dispatcher/src/IngestDispatcher.Functions/IngestDispatcher.Functions.csproj"
      - ".github/workflows/deploy-branch-apps.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ingest-dispatcher-function-dev
  cancel-in-progress: true

env:
  FUNCTION_PROJECT_PATH: src/analytics/ingest/dispatcher/src/IngestDispatcher.Functions/IngestDispatcher.Functions.csproj
  FUNCTION_PUBLISH_PATH: ${{ github.workspace }}/publish
  FUNCTION_APP_NAME: func-wpp-analytics-dev-disp-001

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest #[self-hosted, Linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Azure Function
        run: >-
          dotnet publish "${{ env.FUNCTION_PROJECT_PATH }}"
          --configuration Release
          --output "${{ env.FUNCTION_PUBLISH_PATH }}"
          -p:IngestEnv=dev

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.FUNCTION_PUBLISH_PATH }}